name = "devmania"
main = ".cloudflare/index.js"
compatibility_date = "2026-09-20"

[build]
command = "node scripts/build-cloudflare.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/server/*", "/.openai/*"]

[vars]
OPENAI_MODEL = "gpt-4.1-mini"

[[durable_objects.bindings]]
name = "STORE_ORDERS"
class_name = "StoreOrder"

[[migrations]]
tag = "store-orders-v1"
new_sqlite_classes = ["StoreOrder"]
